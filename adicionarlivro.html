<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMatch - Adicionar Livro</title>
    <style>
      @font-face {
        font-family: 'Radiant Charisma';
        src: url('fonts/RadiantCharismaDEMO-Medium.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Quicksand';
        src: url('fonts/Quicksand-Bold.ttf') format('truetype');
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        height: 100vh;
        display: flex;
        font-family: 'Quicksand', sans-serif;
        background-color: #fffdf3;
        overflow: hidden;
      }

      .barra-lateral {
        width: 280px;
        min-width: 280px;
        background-color: #701d1c;
        display: flex;
        flex-direction: column;
        padding: 50px 0;
        position: relative;
        overflow: hidden;
        z-index: 1;
      }
      .barra-lateral::before {
        content: '';
        position: absolute;
        bottom: -80px; left: -80px;
        width: 300px; height: 300px;
        background: rgba(173, 114, 114, 0.22);
        border-radius: 45% 55% 40% 60%;
        pointer-events: none;
      }
      .barra-lateral::after {
        content: '';
        position: absolute;
        top: -40px; right: -40px;
        width: 180px; height: 180px;
        background: rgba(173, 114, 114, 0.22);
        border-radius: 60% 40% 55% 45%;
        pointer-events: none;
      }
      .container-nome-sistema {
        padding: 0 30px 50px;
        z-index: 2;
      }
      .container-nome-sistema h1 {
        font-family: 'Radiant Charisma';
        font-size: 36px;
        line-height: 0.9;
      }
      .container-nome-sistema h1 span:first-child { color: #bcb24d; }
      .container-nome-sistema h1 span:last-child  { color: #e6a921; }
      .rotulo-nav {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: rgba(255,255,255,0.5);
        padding: 20px 30px 10px;
        z-index: 2;
        font-weight: bold;
      }
      .item-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 30px;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        z-index: 2;
        text-decoration: none;
      }
      .item-nav:hover { background: rgba(255,255,255,0.1); }
      .item-nav.ativo {
        background: rgba(255,255,255,0.15);
        font-weight: bold;
        border-left: 4px solid #e6a921;
      }
      .notificacao {
        margin-left: auto;
        background: #e4568b;
        color: #fff;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 10px;
      }

      .conteudo {
        flex: 1;
        padding: 36px 40px;
        overflow-y: auto;
        background-color: #fffdf3;
      }
      .page-title {
        font-family: 'Radiant Charisma';
        font-size: 28px;
        color: #2c2c2c;
        text-align: center;
        margin-bottom: 28px;
      }

      .busca-wrap {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .busca-input {
        flex: 1;
        height: 48px;
        border-radius: 30px;
        background-color: #ede9d3;
        border: none;
        padding: 0 20px;
        font-size: 14px;
        font-family: 'Quicksand';
        outline: none;
        color: #2c2c2c;
      }
      .busca-input::placeholder { color: #a6a6a6; }

      .loading {
        text-align: center;
        padding: 20px;
        color: #a6a6a6;
        font-size: 14px;
        display: none;
      }
      .livro-card {
        background-color: #ede9d3;
        border-radius: 14px;
        padding: 16px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 14px;
        position: relative;
      }
      .livro-capa {
        width: 70px;
        height: 95px;
        border-radius: 6px;
        flex-shrink: 0;
        object-fit: cover;
        background-color: #c0b090;
      }
      .livro-info { flex: 1; }
      .livro-titulo {
        font-family: 'Radiant Charisma';
        font-size: 17px;
        color: #2c2c2c;
        margin-bottom: 2px;
      }
      .livro-autor {
        font-size: 12px;
        color: #a6a6a6;
        margin-bottom: 8px;
      }
      .tags-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .tag {
        padding: 3px 12px;
        border-radius: 14px;
        background-color: #e6a921;
        color: white;
        font-size: 11px;
        font-weight: 700;
      }
      .tag.cinza { background-color: #a6a6a6; }
      .livro-desc {
        font-size: 12px;
        color: #6a6a6a;
        line-height: 1.5;
      }
      .btn-adicionar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-color: #81833c;
        color: white;
        border: none;
        font-size: 22px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }
      .btn-adicionar:hover { background-color: #5a5c2a; }
      .btn-adicionar.adicionado {
        background-color: #4caf50;
        font-size: 16px;
        cursor: default;
      }

      /* ── MENU ESTANTE ── */
      .menu-estante {
        position: absolute;
        right: 60px;
        top: 16px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        padding: 8px 0;
        z-index: 100;
        min-width: 160px;
        display: none;
      }
      .menu-estante.aberto { display: block; }
      .menu-estante-titulo {
        font-size: 11px;
        font-weight: 700;
        color: #a6a6a6;
        padding: 6px 16px;
        letter-spacing: 1px;
      }
      .menu-opcao {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 13px;
        color: #2c2c2c;
        font-family: 'Quicksand';
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        transition: background 0.2s;
      }
      .menu-opcao:hover { background-color: #f5f0e8; }
      /* NOVO: opção já adicionada */
      .menu-opcao.ja-adicionado {
        color: #a6a6a6;
        cursor: default;
      }
      .menu-opcao.ja-adicionado:hover { background: none; }

      /* ── PAGINAÇÃO ── */
      .paginacao {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
        padding-bottom: 20px;
      }
      .btn-pagina {
        padding: 8px 20px;
        border-radius: 20px;
        border: none;
        background-color: #bbbd63;
        color: white;
        font-family: 'Quicksand';
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-pagina:disabled {
        background-color: #ede9d3;
        color: #a6a6a6;
        cursor: not-allowed;
      }
      .pagina-info { font-size: 13px; color: #6a6a6a; }

      /* ── TOAST ── */
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #701d1c;
        color: white;
        padding: 12px 28px;
        border-radius: 30px;
        font-size: 14px;
        font-family: 'Quicksand';
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 999;
        pointer-events: none;
      }
      .toast.visivel { opacity: 1; }

      /* ── MENSAGEM VAZIA ── */
      .msg-vazia {
        text-align: center;
        color: #a6a6a6;
        font-size: 14px;
        margin-top: 40px;
        display: none;
      }

      /* ── FORM MANUAL ── */
      .btn-manual {
        height: 48px; padding: 0 20px; border-radius: 30px;
        background: #ede9d3; border: none; font-family: 'Quicksand';
        font-size: 13px; font-weight: bold; color: #701d1c;
        cursor: pointer; white-space: nowrap; transition: 0.2s;
        flex-shrink: 0;
      }
      .btn-manual:hover { background: #d4cdb8; }
      .btn-manual.ativo { background: #701d1c; color: #fff; }
      .form-manual {
        background: #ede9d3; border-radius: 16px; padding: 24px;
        margin-bottom: 24px; display: none;
      }
      .form-manual.visivel { display: block; }
      .form-manual h3 { font-family: 'Radiant Charisma'; font-size: 20px; color: #701d1c; margin-bottom: 16px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
      .form-field label { font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #701d1c; display: block; margin-bottom: 4px; }
      .form-field input, .form-field select {
        width: 100%; height: 40px; background: #fffdf3; border: none;
        border-radius: 20px; padding: 0 14px; font-family: 'Quicksand';
        font-size: 13px; outline: none; color: #2c2c2c;
      }
      .form-destino { display: flex; gap: 12px; margin-bottom: 16px; }
      .form-destino label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
      .form-manual-btn {
        width: 100%; height: 44px; background: #701d1c; color: #fff;
        border: none; border-radius: 30px; font-family: 'Quicksand';
        font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
      }
      .form-manual-btn:hover { background: #5a1615; }
    </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="barra-lateral">
    <div class="container-nome-sistema">
      <h1>
        <span>book</span><br>
        <span>match</span>
      </h1>
    </div>

    <span class="rotulo-nav">PRINCIPAL</span>
    <a class="item-nav" href="estante.html">📚 Minha Estante</a>
    <a class="item-nav ativo" href="adicionarlivro.html">🔍 Adicionar Livro</a>
    <a class="item-nav" href="descobrir.html">🔎 Descobrir Livros</a>
    <a class="item-nav" href="curtidas.html"> 💕 Curtidas</a>
    <a class="item-nav" href="mensagens.html">💬 Mensagens <span class="notificacao">3</span></a>
    <a class="item-nav" href="configuracao.html">⚙️ Configurações</a>

    <span class="rotulo-nav">SUAS LISTAS</span>
    <a class="item-nav" href="matches.html">❤️ Matches</a>
    <a class="item-nav" href="troca.html">✅ Trocas</a>
    <a class="item-nav" href="queroler.html">🛒 Quero ler</a>

    <span class="rotulo-nav">CONTA</span>
    <a class="item-nav" href="#" onclick="logout()">🚪 Sair</a>
  </aside>

  <!-- CONTEÚDO -->
  <div class="conteudo">
    <div class="page-title">Adicionar Livro à estante</div>

    <div class="busca-wrap">
      <input class="busca-input" type="text" id="campoBusca" placeholder="Digite o título ou autor...">
      <button class="btn-manual" id="btnManual" onclick="toggleManual()">📝 Manual</button>
    </div>

    <!-- FORMULÁRIO DE CADASTRO MANUAL -->
    <div class="form-manual" id="formManual">
      <h3>Cadastro Manual</h3>
      <div class="form-grid">
        <div class="form-field" style="grid-column:1/-1;">
          <label>TÍTULO *</label>
          <input id="mTitulo" type="text" placeholder="Título do livro">
        </div>
        <div class="form-field">
          <label>AUTOR</label>
          <input id="mAutor" type="text" placeholder="Nome do autor">
        </div>
        <div class="form-field">
          <label>ANO</label>
          <input id="mAno" type="number" placeholder="Ex: 2020">
        </div>
        <div class="form-field">
          <label>GÊNERO</label>
          <select id="mGenero">
            <option value="">— Selecione —</option>
            <option>Ficção</option><option>Fantasia</option><option>Ficção Científica</option>
            <option>Romance</option><option>Terror</option><option>Suspense</option>
            <option>Aventura</option><option>Biografia</option><option>Autoajuda</option>
            <option>Clássicos</option><option>HQ/Mangás</option><option>Não-Ficção</option>
          </select>
        </div>
        <div class="form-field">
          <label>EDITORA</label>
          <input id="mEditora" type="text" placeholder="Editora">
        </div>
        <div class="form-field" style="grid-column:1/-1;">
          <label>URL DA CAPA <span style="font-weight:normal;color:#a6a6a6;">(opcional)</span></label>
          <input id="mFoto" type="url" placeholder="https://...">
        </div>
      </div>
      <div class="form-destino">
        <label><input type="radio" name="mDestino" value="troca" checked> 🔄 Troca</label>
        <label><input type="radio" name="mDestino" value="queroler"> 📚 Quero Ler</label>
      </div>
      <div id="erroManual" style="color:#b33a3a;font-size:13px;margin-bottom:10px;display:none;"></div>
      <button class="form-manual-btn" onclick="cadastrarManual()">Adicionar à Estante</button>
    </div>

    <div class="loading" id="loading">🔍 Buscando livros...</div>
    <div class="msg-vazia" id="msgVazia">Nenhum livro encontrado. Tente outro termo.</div>
    <div id="listaLivros"></div>

    <div class="paginacao" id="paginacao" style="display:none;">
      <button class="btn-pagina" id="btnAnterior" onclick="mudarPagina(-1)">← Anterior</button>
      <span class="pagina-info" id="infoPagina">Página 1</span>
      <button class="btn-pagina" id="btnProxima" onclick="mudarPagina(1)">Próxima →</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    let paginaAtual = 1;
    const porPagina = 4;
    let termoBusca = '';
    let timerBusca = null;
    let menuAberto = null;

    const usuario = JSON.parse(sessionStorage.getItem('usuario'));
    if (!usuario?.codusuario) window.location.href = 'index.html';

    function logout() {
      sessionStorage.removeItem('usuario');
      window.location.href = 'index.html';
    }

    const adicionados = new Set();

    function jaAdicionado(titulo, estante) {
      return adicionados.has(`${titulo}:${estante}`);
    }
    /* ════════════════════════════════════════ */

    const traducaoGeneros = {
      'Fiction': 'Ficção',
      'Fantasy': 'Fantasia',
      'Fantasy fiction': 'Fantasia',
      'Romance': 'Romance',
      'Horror': 'Terror',
      'Horror fiction': 'Terror',
      'Science fiction': 'Ficção Científica',
      'Science Fiction': 'Ficção Científica',
      'Mystery': 'Mistério',
      'Mystery fiction': 'Mistério',
      'Thriller': 'Suspense',
      'Adventure': 'Aventura',
      'Adventure fiction': 'Aventura',
      'Historical fiction': 'Ficção Histórica',
      'Biography': 'Biografia',
      'Autobiography': 'Autobiografia',
      'Self-help': 'Autoajuda',
      'Poetry': 'Poesia',
      'Drama': 'Drama',
      'Comics': 'HQ',
      'Manga': 'Mangá',
      'Children': 'Infantil',
      'Juvenile fiction': 'Infantil',
      'Young adult fiction': 'Jovem Adulto',
      'Nonfiction': 'Não-Ficção',
      'Non-fiction': 'Não-Ficção',
      'Classic': 'Clássico',
      'Classics': 'Clássicos',
      'Philosophy': 'Filosofia',
      'Psychology': 'Psicologia',
      'History': 'História',
      'Science': 'Ciência',
      'Religion': 'Religião',
      'Spirituality': 'Espiritualidade',
    };

    function ehGeneroValido(subject) {
      const prefixosInvalidos = ['nyt:', 'award:', 'lib:', 'goodreads:', 'opds:'];
      return !prefixosInvalidos.some(p => subject.toLowerCase().startsWith(p));
    }

    function traduzirGenero(genero) {
      if (!genero) return '—';
      if (traducaoGeneros[genero]) return traducaoGeneros[genero];
      const chave = Object.keys(traducaoGeneros).find(
        k => k.toLowerCase() === genero.toLowerCase()
      );
      if (chave) return traducaoGeneros[chave];
      return genero;
    }

    document.getElementById('campoBusca').addEventListener('input', function() {
      const termo = this.value.trim();
      clearTimeout(timerBusca);

      if (termo.length < 3) {
        document.getElementById('listaLivros').innerHTML = '';
        document.getElementById('paginacao').style.display = 'none';
        document.getElementById('msgVazia').style.display = 'none';
        return;
      }

      timerBusca = setTimeout(() => {
        termoBusca = termo;
        paginaAtual = 1;
        buscarLivros();
      }, 500);
    });

    async function buscarLivros() {
      const loading   = document.getElementById('loading');
      const lista     = document.getElementById('listaLivros');
      const msgVazia  = document.getElementById('msgVazia');
      const paginacao = document.getElementById('paginacao');

      loading.style.display = 'block';
      lista.innerHTML = '';
      msgVazia.style.display = 'none';
      paginacao.style.display = 'none';

      const offset = (paginaAtual - 1) * porPagina;
      const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(termoBusca)}&limit=${porPagina}&offset=${offset}`;

      try {
        const resposta = await fetch(url);
        const dados = await resposta.json();

        loading.style.display = 'none';

        if (!dados.docs || dados.docs.length === 0) {
          msgVazia.style.display = 'block';
          return;
        }

        const totalPaginas = Math.ceil(Math.min(dados.numFound, 60) / porPagina);
        document.getElementById('infoPagina').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
        document.getElementById('btnAnterior').disabled = paginaAtual === 1;
        document.getElementById('btnProxima').disabled  = paginaAtual >= totalPaginas;
        paginacao.style.display = 'flex';

        // Cria placeholders para preservar a ordem enquanto as promises resolvem
        const placeholders = dados.docs.map(() => {
          const ph = document.createElement('div');
          ph.className = 'livro-card';
          ph.style.cssText = 'min-height:140px;opacity:0.4;';
          lista.appendChild(ph);
          return ph;
        });

        // ── busca detalhes do work em paralelo para cada livro (original mantido) ──
        const promises = dados.docs.map(async (livro, index) => {
          const titulo  = livro.title || 'Título desconhecido';
          const autor   = livro.author_name ? livro.author_name[0] : 'Autor desconhecido';
          const ano     = livro.first_publish_year || '—';
          const capaId  = livro.cover_i;
          const capaUrl = capaId
            ? `https://covers.openlibrary.org/b/id/${capaId}-M.jpg`
            : '';

          let genero    = '—';
          let descricao = 'Sem descrição disponível.';

          if (livro.key) {
            try {
              const resWork = await fetch(`https://openlibrary.org${livro.key}.json`);
              const work = await resWork.json();

              if (work.description) {
                descricao = typeof work.description === 'object'
                  ? work.description.value
                  : work.description;
                if (descricao.length > 180) descricao = descricao.slice(0, 180) + '...';
              }

              if (work.subjects && work.subjects.length > 0) {
                const subjectsValidos = work.subjects.filter(ehGeneroValido);
                const match = subjectsValidos.find(s =>
                  Object.keys(traducaoGeneros).some(k => k.toLowerCase() === s.toLowerCase())
                );
                genero = traduzirGenero(match || subjectsValidos[0] || work.subjects[0]);
              }

            } catch (_) { /* mantém valores padrão */ }
          }

        const dadosLivro = { titulo, autor, genero, ano, capaUrl, cor: '#c0b090', status: 'disponivel' };

          const emQL = jaAdicionado(titulo, 'queroler');
          const emTR = jaAdicionado(titulo, 'troca');

          const cardId = `card-${index}`;
          const card = document.createElement('div');
          card.className = 'livro-card';
          card.id = cardId;
          card.dataset.livro = JSON.stringify(dadosLivro);

          card.innerHTML = `
            ${capaUrl
              ? `<img class="livro-capa" src="${capaUrl}" alt="Capa de ${titulo}">`
              : `<div class="livro-capa"></div>`
            }
            <div class="livro-info">
              <div class="livro-titulo">${titulo}</div>
              <div class="livro-autor">${autor} · ${ano}</div>
              <div class="tags-row">
                <span class="tag">${genero}</span>
                <span class="tag">${ano}</span>
              </div>
              <div class="livro-desc">${descricao}</div>
            </div>
            <button
              class="btn-adicionar${(emQL && emTR) ? ' adicionado' : ''}"
              id="btn-${cardId}"
              onclick="event.stopPropagation(); abrirMenu('${cardId}')"
              ${(emQL && emTR) ? 'disabled title="Já adicionado a todas as estantes"' : ''}>
              ${(emQL && emTR) ? '✓' : '+'}
            </button>
            <div class="menu-estante" id="menu-${cardId}">
              <div class="menu-estante-titulo">ADICIONAR À...</div>
              <button
                class="menu-opcao${emQL ? ' ja-adicionado' : ''}"
                id="opcao-ql-${cardId}"
                onclick="${emQL ? 'void(0)' : `adicionarLivro('${cardId}', 'queroler')`}">
                📚 Quero Ler${emQL ? ' ✓' : ''}
              </button>
              <button
                class="menu-opcao${emTR ? ' ja-adicionado' : ''}"
                id="opcao-tr-${cardId}"
                onclick="${emTR ? 'void(0)' : `adicionarLivro('${cardId}', 'troca')`}">
                🔄 Troca${emTR ? ' ✓' : ''}
              </button>
            </div>
          `;

          // Substitui o placeholder na posição correta
          placeholders[index].replaceWith(card);
        });

        await Promise.all(promises);

      } catch (erro) {
        loading.style.display = 'none';
        lista.innerHTML = '<p style="color:#a6a6a6;text-align:center;margin-top:20px;">Erro ao buscar livros. Verifique sua conexão.</p>';
      }
    }

    function mudarPagina(direcao) {
      paginaAtual += direcao;
      buscarLivros();
      document.querySelector('.conteudo').scrollTop = 0;
    }

    function abrirMenu(cardId) {
      if (menuAberto && menuAberto !== `menu-${cardId}`) {
        document.getElementById(menuAberto).classList.remove('aberto');
      }
      const menu = document.getElementById(`menu-${cardId}`);
      menu.classList.toggle('aberto');
      menuAberto = menu.classList.contains('aberto') ? `menu-${cardId}` : null;
    }

    async function adicionarLivro(cardId, estante) {
      const card      = document.getElementById(cardId);
      const dados     = JSON.parse(card.dataset.livro);
      const nomeLabel = estante === 'queroler' ? 'Quero Ler' : 'Troca';
      const opcaoId   = estante === 'queroler' ? `opcao-ql-${cardId}` : `opcao-tr-${cardId}`;
      const emoji     = estante === 'queroler' ? '📚' : '🔄';

      if (jaAdicionado(dados.titulo, estante)) return;

      try {
        await fetch('api/adicionar_livro.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: usuario.codusuario,
            titulo: dados.titulo,
            autor: dados.autor,
            genero: dados.genero,
            ano: dados.ano,
            foto: dados.capaUrl,
            destino: estante,
          }),
        });

        adicionados.add(`${dados.titulo}:${estante}`);

        const opcao = document.getElementById(opcaoId);
        opcao.classList.add('ja-adicionado');
        opcao.setAttribute('onclick', 'void(0)');
        opcao.textContent = `${emoji} ${nomeLabel} ✓`;

        const emQL = jaAdicionado(dados.titulo, 'queroler');
        const emTR = jaAdicionado(dados.titulo, 'troca');
        if (emQL && emTR) {
          const btn = document.getElementById(`btn-${cardId}`);
          btn.classList.add('adicionado');
          btn.disabled = true;
          btn.title = 'Já adicionado a todas as estantes';
          btn.textContent = '✓';
        }

        if (menuAberto) {
          document.getElementById(menuAberto).classList.remove('aberto');
          menuAberto = null;
        }

        mostrarToast(`✅ "${dados.titulo}" adicionado à estante ${nomeLabel}!`);
      } catch (e) {
        mostrarToast('Erro ao adicionar livro.');
      }
    }

    function mostrarToast(mensagem) {
      const toast = document.getElementById('toast');
      toast.textContent = mensagem;
      toast.classList.add('visivel');
      setTimeout(() => toast.classList.remove('visivel'), 3000);
    }

    document.addEventListener('click', function(e) {
      if (menuAberto && !e.target.closest('.livro-card')) {
        document.getElementById(menuAberto).classList.remove('aberto');
        menuAberto = null;
      }
    });

    function toggleManual() {
      const form = document.getElementById('formManual');
      const btn  = document.getElementById('btnManual');
      const aberto = form.classList.toggle('visivel');
      btn.classList.toggle('ativo', aberto);
      if (aberto) {
        document.getElementById('campoBusca').value = '';
        document.getElementById('listaLivros').innerHTML = '';
        document.getElementById('paginacao').style.display = 'none';
      }
    }

    async function cadastrarManual() {
      const titulo  = document.getElementById('mTitulo').value.trim();
      const autor   = document.getElementById('mAutor').value.trim();
      const ano     = document.getElementById('mAno').value.trim();
      const genero  = document.getElementById('mGenero').value;
      const editora = document.getElementById('mEditora').value.trim();
      const foto    = document.getElementById('mFoto').value.trim();
      const destino = document.querySelector('input[name="mDestino"]:checked').value;
      const erroEl  = document.getElementById('erroManual');
      erroEl.style.display = 'none';

      if (!titulo) {
        erroEl.textContent = 'O título é obrigatório.';
        erroEl.style.display = 'block';
        return;
      }

      try {
        const resp = await fetch('api/adicionar_livro.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuario.codusuario, titulo, autor, genero, editora, ano, foto, destino }),
        });
        const dados = await resp.json();

        if (dados.sucesso || dados.estante_cod) {
          adicionados.add(`${titulo}:${destino}`);
          mostrarToast(`✅ "${titulo}" adicionado à estante!`);
          ['mTitulo','mAutor','mAno','mEditora','mFoto'].forEach(id => document.getElementById(id).value = '');
          document.getElementById('mGenero').value = '';
        } else {
          erroEl.textContent = dados.erro || 'Erro ao adicionar livro.';
          erroEl.style.display = 'block';
        }
      } catch (e) {
        erroEl.textContent = 'Erro ao conectar com o servidor.';
        erroEl.style.display = 'block';
      }
    }
  </script>

</body>
